<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fretamento individual - Glysk</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap"
        rel="stylesheet"
    >

</head>

<body>

    <header class="titulomenu">

        <div class="titulo">

            <h1 class="h1menu">
                Glysk
            </h1>

            <h3 class="h3menu">
                Seu tempo merece voar
            </h3>

        </div>


        <div class="botoes">

            <a
                href="menu.html"
                class="botaocriarconta"
            >
                Menu
            </a>

            <a
                href="index.html"
                class="botaologin"
            >
                Sair
            </a>

        </div>

    </header>


    <main>

        <section class="fretepagina">

            <h1>
                Fretamento individual
            </h1>

            <p>
                Você está logado. Finalize os dados para solicitar
                sua cotação.
            </p>


            <form
                class="formfrete"
                action="cotacaoconcluida.html"
                method="get"
            >

                <div class="campos">

                    <div class="campo">

                        <label for="origem">
                            Origem
                        </label>

                        <input
                            type="text"
                            id="origem"
                            name="origem"
                            placeholder="Ex: Porto Alegre, RS"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="destino">
                            Destino
                        </label>

                        <input
                            type="text"
                            id="destino"
                            name="destino"
                            placeholder="Ex: Gramado, RS"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="data">
                            Data do voo
                        </label>

                        <input
                            type="date"
                            id="data"
                            name="data"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="horario">
                            Horário de saída
                        </label>

                        <input
                            type="time"
                            id="horario"
                            name="horario"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="passageiros">
                            Quantidade de passageiros
                        </label>

                        <input
                            type="number"
                            id="passageiros"
                            name="passageiros"
                            min="1"
                            placeholder="Ex: 2"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="aeronave">
                            Escolha sua aeronave
                        </label>

                        <select
                            id="aeronave"
                            name="aeronave"
                            required
                        >

                            <option value="">
                                Selecione uma aeronave
                            </option>

                            <option value="phenom100">
                                Embraer Phenom 100 - Jato executivo
                            </option>

                            <option value="phenom300">
                                Embraer Phenom 300 - Jato executivo
                            </option>

                            <option value="kingair350">
                                King Air 350 - Avião
                            </option>

                            <option value="pc12">
                                Pilatus PC-12 - Avião
                            </option>

                            <option value="r44">
                                Robinson R44 - Helicóptero
                            </option>

                            <option value="h125">
                                Airbus H125 - Helicóptero
                            </option>

                        </select>

                    </div>


                    <div class="campo">

                        <label for="viagem">
                            Tipo de viagem
                        </label>

                        <select
                            id="viagem"
                            name="viagem"
                            required
                        >

                            <option value="">
                                Selecione uma opção
                            </option>

                            <option value="ida">
                                Somente ida
                            </option>

                            <option value="ida-volta">
                                Ida e volta
                            </option>

                        </select>

                    </div>

                </div>


                <button type="submit">
                    Solicitar cotação
                </button>

            </form>

        </section>

    </main>


    <footer>

        <p>
            © 2026 Glysk - Seu tempo merece voar
        </p>

    </footer>

</body>

</html>
